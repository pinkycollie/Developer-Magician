version: 2
updates:
  # 1. Front-End Web Dashboard (pnpm Monorepo Layer)
  - package-ecosystem: "pnpm"
    directory: "/apps/web-dashboard"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "pnpm"
      - "frontend"
    commit-message:
      prefix: "chore(deps-web)"
      include: "scope"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # 2. Open Edge Node Agent Package (pnpm/npm Monorepo Layer)
  - package-ecosystem: "npm"
    directory: "/packages/node-agent"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "node-agent"
    commit-message:
      prefix: "chore(deps-agent)"
      include: "scope"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # 3. Python Automation/Data Tools (pip Background Layer)
  - package-ecosystem: "pip"
    directory: "/" # Scans requirements.txt or pyproject.toml at root
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps-python)"
      include: "scope"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # 4. GitHub Actions Workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps-infra)"
      include: "scope"