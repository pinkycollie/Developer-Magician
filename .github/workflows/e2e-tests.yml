# .github/workflows/e2e-tests.yml
name: End-to-End Tests

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  playwright-tests:
    runs-on:
      
    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
      - - name: Setup uv
  # You may pin to the exact commit or the version.
  # uses: yezz123/setup-uv@ab6be5a42627f19dc36e57b548592a5e52cece4a
  uses: yezz123/setup-uv@v4.1
  with:
    # uv version to use. If not provided, the latest stable version will be used.
    uv-version: # optional
    # Virtual environment name to create and activate.
    uv-venv: # optional
    # Whether to cache uv packages. Only supported for uv versions >= 0.3.0.
    uv-cache: # optional, default is false
    # Directory to use for uv cache. If not specified, a platform-appropriate default will be used.
    uv-cache-dir: # optional
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright
        run: npx playwright install --with-deps
      - name: Run tests
        run: npx playwright test --project=${{ matrix.browser }}
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-results-${{ matrix.browser }}
          path: playwright-report/
      - name: Run accessibility audit
        run: uv run test:a11y
